name: PR cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-prerelease:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || echo "no pre-release to delete"
        env:
          GH_TOKEN: ${{ github.token }}
