name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read-only deploy key for opensyllabus/os-normalizer. Drop this step and
      # the `--ssh default` build flag once os-normalizer is public.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OS_NORMALIZER_DEPLOY_KEY }}
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task docker:build
      - run: task docker:lock
      - run: task docker:test
      - run: task docker:lint
