# https://taskfile.dev

version: '3'

tasks:

  docker:build:
    desc: Build the Docker image
    env:
      DOCKER_BUILDKIT: 1
    cmds:
      - >
        docker build
        --platform linux/amd64
        --build-arg=CODE_DIR=/opt/os-institutions
        -t os_institutions
        {{.CLI_ARGS}} .

  docker:bash:
    desc: Start a bash shell in the Docker container
    cmds:
      - >
        docker run -it --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        {{.CLI_ARGS}}
        os_institutions
        bash

  docker:test:
    desc: Run tests (tests needing the built matcher skip when it is absent)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'pytest {{.CLI_ARGS}}'

  docker:lint:
    desc: Run linter
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'ruff check {{.CLI_ARGS}} && ruff format --check {{.CLI_ARGS}}'

  docker:repro:
    desc: Run the DVC pipeline (dvc repro; pass stage names or flags after --)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'dvc repro {{.CLI_ARGS}}'

  docker:dag:
    desc: Show the pipeline DAG
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'dvc dag {{.CLI_ARGS}}'

  docker:metrics:
    desc: Compare stage metrics with git HEAD as markdown (dvc metrics diff)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'dvc metrics diff --md {{.CLI_ARGS}}'
