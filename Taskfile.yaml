# https://taskfile.dev

version: '3'

tasks:

  docker:build:
    desc: "Build the Docker image (while os-normalizer is private: SSH_KEY=path/to/key for a local key file, otherwise the ssh agent is used)"
    env:
      DOCKER_BUILDKIT: 1
    cmds:
      - >
        docker build
        --platform linux/amd64
        --build-arg=CODE_DIR=/opt/os-institutions
        --ssh default{{if .SSH_KEY}}={{.SSH_KEY}}{{end}}
        -t os_institutions
        {{.CLI_ARGS}} .

  docker:build:dvc:
    desc: Build the Docker image with DVC, for pipeline runs (same SSH_KEY note)
    env:
      DOCKER_BUILDKIT: 1
    cmds:
      - >
        docker build
        --platform linux/amd64
        --build-arg=CODE_DIR=/opt/os-institutions
        --build-arg=UV_SYNC_ARGS="--group dvc"
        --ssh default{{if .SSH_KEY}}={{.SSH_KEY}}{{end}}
        -t os_institutions:dvc
        {{.CLI_ARGS}} .

  docker:bash:
    desc: Start a bash shell in the Docker container
    cmds:
      - >
        docker run -it --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        {{.CLI_ARGS}}
        os_institutions
        bash

  docker:lock:
    desc: Verify uv.lock is up to date (needs no credentials)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        uv lock --check

  docker:lock:update:
    desc: "Update uv.lock (fetches os-normalizer; SSH_KEY=path/to/key while it is private)"
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        -v {{.SSH_KEY}}:/tmp/ssh_key:ro
        -e GIT_CONFIG_COUNT=1
        -e GIT_CONFIG_KEY_0=url.git@github.com:.insteadOf
        -e GIT_CONFIG_VALUE_0=https://github.com/
        -e GIT_SSH_COMMAND='ssh -i /tmp/ssh_key -o IdentitiesOnly=yes'
        os_institutions
        uv lock {{.CLI_ARGS}}

  docker:test:
    desc: Run tests (tests needing the built matcher skip when it is absent)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        uv run pytest {{.CLI_ARGS}}

  docker:lint:
    desc: Run linter
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'uv run ruff check {{.CLI_ARGS}} && uv run ruff format --check {{.CLI_ARGS}}'

  docker:compare:
    desc: "Compare two matchers on a sample (aggregates only), e.g. -- --path .private/sample --old old.json.gz --new new.json.gz"
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        -e TQDM_DISABLE
        os_institutions
        uv run python -m os_institutions.matcher.compare {{.CLI_ARGS}}

  docker:repro:
    desc: Run the DVC pipeline (needs docker:build:dvc; pass stage names or flags after --)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc repro {{.CLI_ARGS}}

  docker:dag:
    desc: Show the pipeline DAG (needs docker:build:dvc)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc dag {{.CLI_ARGS}}

  docker:metrics:
    desc: Compare stage metrics with git HEAD as markdown (needs docker:build:dvc)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc metrics diff --md {{.CLI_ARGS}}

  pr:publish:
    desc: "Upload artifacts/ and metrics/ to the pr-<N> pre-release and comment on the PR (PR=<N>, default: current branch's PR; DRY_RUN=1 to preview). Needs gh."
    cmds:
      - scripts/pr_release.sh publish {{.PR}}

  pr:clean:
    desc: "Delete the pr-<N> pre-release and tag (PR=<N>, default: current branch's PR). Needs gh."
    cmds:
      - scripts/pr_release.sh clean {{.PR}}

  release:publish:
    desc: "Create the GitHub release TAG=vX.Y.Z from artifacts/ (or -- --assets DIR --sources-file FILE; DRY_RUN=1 to preview). Needs gh, jq."
    cmds:
      - scripts/release.sh {{.TAG}} {{.CLI_ARGS}}
