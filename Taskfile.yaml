# https://taskfile.dev

version: '3'

tasks:

  docker:build:
    desc: Build the Docker image
    env:
      DOCKER_BUILDKIT: 1
    cmds:
      - >
        docker build
        --platform linux/amd64
        --build-arg=CODE_DIR=/opt/os-institutions
        -t os_institutions
        {{.CLI_ARGS}} .

  docker:build:dvc:
    desc: Build the Docker image with DVC, for pipeline runs
    env:
      DOCKER_BUILDKIT: 1
    cmds:
      - >
        docker build
        --platform linux/amd64
        --build-arg=CODE_DIR=/opt/os-institutions
        --build-arg=UV_SYNC_ARGS="--group dvc"
        -t os_institutions:dvc
        {{.CLI_ARGS}} .

  docker:bash:
    desc: Start a bash shell in the Docker container
    cmds:
      - >
        docker run -it --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        {{.CLI_ARGS}}
        os_institutions
        bash

  docker:lock:
    desc: Update uv.lock (pass --check to only verify it)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        uv lock {{.CLI_ARGS}}

  docker:test:
    desc: Run tests (tests needing the built matcher skip when it is absent)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        uv run pytest {{.CLI_ARGS}}

  docker:lint:
    desc: Run linter
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions
        /bin/sh -c 'uv run ruff check {{.CLI_ARGS}} && uv run ruff format --check {{.CLI_ARGS}}'

  docker:repro:
    desc: Run the DVC pipeline (needs docker:build:dvc; pass stage names or flags after --)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc repro {{.CLI_ARGS}}

  docker:dag:
    desc: Show the pipeline DAG (needs docker:build:dvc)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc dag {{.CLI_ARGS}}

  docker:metrics:
    desc: Compare stage metrics with git HEAD as markdown (needs docker:build:dvc)
    cmds:
      - >
        docker run --rm
        --platform linux/amd64
        -v $(pwd):/opt/os-institutions
        os_institutions:dvc
        uv run dvc metrics diff --md {{.CLI_ARGS}}
