[tool.poetry]
name = "os-institutions"
version = "0.1.0"
description = "Educational and research institutions dataset and matcher, based on ROR, IPEDS, and Wikidata"
authors = ["Open Syllabus <contact@opensyllabus.org>"]
readme = "README.md"
packages = [{ include = "os_institutions" }]

[tool.poetry.dependencies]
python = "~3.10"
pandas = "^1.3.1"
numpy = "<2"
pandera = "^0.10.0"
pyarrow = "^7.0.0"
typer = ">=0.9.0"
requests = "^2.24.0"
pyyaml = "^6.0"
loguru = "^0.5.3"
tqdm = "^4.66.1"
tldextract = "^3.0.1"
titlecase = "^2.3"
Unidecode = "^1.2.0"
regex = ">=2023.10.3"
nltk = "^3.6.2"
SPARQLWrapper = "^1.8.5"
addict = "^2.3.0"
python-dotenv = "^0.19.0"
# Temporary: removed in PR #2 (W&B removal).
wandb = ">=0.19.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-mock = "^3.7.0"
ruff = "^0.15.6"

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    "__pycache__",
    ".ipynb_checkpoints",
    "*.ipynb",
    "wandb",
    "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/matcher/test_match.py" = ["E501"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
known-first-party = ["os_institutions"]
known-third-party = ["wandb"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
