[project]
name = "os-institutions"
version = "0.1.0"
description = "Educational and research institutions dataset and matcher, based on ROR, IPEDS, and Wikidata"
readme = "README.md"
authors = [{ name = "Open Syllabus", email = "contact@opensyllabus.org" }]
# pyarrow 7 has no wheels for Python 3.11+.
requires-python = ">=3.10,<3.11"
dependencies = [
    "pandas>=1.3.1,<2",
    "numpy<2",
    "pandera>=0.10.0,<0.11",
    "pyarrow>=7.0.0,<26",
    "typer>=0.9.0",
    "requests>=2.24.0,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.5.3,<0.6",
    "tqdm>=4.66.1,<5",
    "tldextract>=3.0.1,<4",
    "titlecase>=2.3,<3",
    "Unidecode>=1.2.0,<2",
    "regex>=2023.10.3",
    "nltk>=3.6.2,<4",
    "SPARQLWrapper>=1.8.5,<2",
    "addict>=2.3.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "pytest-mock>=3.7.0,<4",
    "ruff>=0.15.6,<0.16",
]
# Pipeline driver; installed only with `--group dvc`.
dvc = ["dvc==3.67.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["os_institutions"]
exclude = ["**/.gitignore"]

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    "__pycache__",
    ".ipynb_checkpoints",
    "*.ipynb",
    "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/matcher/test_match.py" = ["E501"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
known-first-party = ["os_institutions"]
