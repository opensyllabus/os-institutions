[project]
name = "os-institutions"
version = "1.0.0"
description = "Educational and research institutions dataset and matcher, based on ROR, IPEDS, and Wikidata"
readme = "README.md"
authors = [{ name = "Open Syllabus", email = "contact@opensyllabus.org" }]
requires-python = ">=3.10"
dependencies = [
    "os-normalizer @ git+https://github.com/opensyllabus/os-normalizer.git@v0.1.1",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "pandera>=0.20",
    "pyarrow>=17",
    "typer>=0.9.0",
    "requests>=2.24.0,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.7.0,<0.8",
    "tqdm>=4.66.1,<5",
    "SPARQLWrapper>=1.8.5,<2",
    "addict>=2.3.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "pytest-mock>=3.7.0,<4",
    "ruff>=0.15.6,<0.16",
]
# Pipeline driver; installed only with `--group dvc`.
dvc = ["dvc==3.67.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["os_institutions"]
exclude = ["**/.gitignore"]

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    "__pycache__",
    ".ipynb_checkpoints",
    "*.ipynb",
    "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/matcher/test_match.py" = ["E501"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
known-first-party = ["os_institutions"]

[tool.uv]
constraint-dependencies = [
    "pygit2>=1.19; python_full_version >= '3.11'",
    "numpy>=2.3; python_full_version >= '3.11'",
]
